<head>

<title>Teleflex NOM-035 — Panel de Resultados</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D2B5A;--navy2:#1A3F7A;--teal:#00796B;
  --white:#fff;--bg:#F0F4FA;--bg2:#E8EEF6;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --border:#E2E8F0;--border2:#CBD5E1;
  --green:#15803D;--amber:#B45309;--red:#991B1B;--purple:#6D28D9;--yellow:#92400E;
  --r:8px;--r2:12px;
  --c-nulo:#15803D;--c-bajo:#B45309;--c-medio:#C05621;--c-alto:#991B1B;--c-muy_alto:#6D28D9;
  --bg-nulo:#D1FAE5;--bg-bajo:#FEF3C7;--bg-medio:#FFEDD5;--bg-alto:#FEE2E2;--bg-muy_alto:#EDE9FE;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sb{width:220px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-logo{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo h1{font-size:14px;font-weight:700;color:#fff;line-height:1.3}
.sb-logo p{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
.sb-doctor{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-doctor p{font-size:10px;color:rgba(255,255,255,.6);line-height:1.5}
.sb-doctor strong{color:rgba(255,255,255,.85);display:block;font-size:11px}
.sb-section{padding:8px 16px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase}
.sb-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 16px;background:none;border:none;color:rgba(255,255,255,.7);font-size:12.5px;cursor:pointer;text-align:left;transition:background .15s}
.sb-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-btn.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.sb-btn .icon{font-size:14px;width:18px;text-align:center}
.sb-status{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.4)}
.sb-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#64748B;margin-right:4px}
.sb-status .dot.on{background:#22C55E}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.topbar h2{font-size:16px;font-weight:700;color:var(--navy)}
.topbar-right{display:flex;align-items:center;gap:8px}
.sync-time{font-size:11px;color:var(--text3)}
.content{flex:1;overflow-y:auto;padding:20px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:none;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-navy{background:var(--navy);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-outline{background:var(--white);color:var(--navy);border:1.5px solid var(--border2)}
.btn-sm{padding:5px 10px;font-size:11px}

/* ── CARDS ── */
.card{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:16px 20px}
.card-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

/* ── STAT CARDS ── */
.stat{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:14px 18px;text-align:center}
.stat-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.stat-val{font-size:28px;font-weight:800;color:var(--navy);line-height:1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:4px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-nulo{background:var(--bg-nulo);color:var(--c-nulo)}
.badge-bajo{background:var(--bg-bajo);color:var(--c-bajo)}
.badge-medio{background:var(--bg-medio);color:var(--c-medio)}
.badge-alto{background:var(--bg-alto);color:var(--c-alto)}
.badge-muy_alto{background:var(--bg-muy_alto);color:var(--c-muy_alto)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--r2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:var(--navy)}
thead th{padding:10px 12px;color:#fff;text-align:left;font-size:11px;font-weight:600;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--bg)}
tbody td{padding:9px 12px;color:var(--text)}
tfoot tr{background:var(--bg2);font-weight:700}
tfoot td{padding:9px 12px;font-size:12px}

/* ── DOM BARS ── */
.dom-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.dom-row:last-child{border-bottom:none}
.dom-label{width:180px;font-size:12px;color:var(--text2);flex-shrink:0}
.dom-bar-bg{flex:1;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.dom-bar{height:100%;border-radius:5px;transition:width .5s ease}
.dom-val{width:36px;text-align:right;font-size:12px;font-weight:600;color:var(--text)}
.dom-nivel{width:70px;text-align:right}

/* ── PROGRESS BAR ── */
.progress-wrap{background:var(--bg2);border-radius:8px;height:14px;overflow:hidden}
.progress-bar{height:100%;border-radius:8px;transition:width .6s ease}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:var(--r2);padding:24px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-name{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.modal-field label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:2px}
.modal-field span{font-size:13px;font-weight:600;color:var(--text)}

/* ── OVERLAY PDF ── */
.pdf-overlay{display:none;position:fixed;inset:0;background:rgba(13,43,90,.85);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.pdf-overlay.show{display:flex}
.pdf-spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.pdf-msg{color:#fff;font-size:16px;font-weight:600}
.pdf-sub{color:rgba(255,255,255,.6);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FILTER ROW ── */
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-row select,.filter-row input{padding:7px 12px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:12.5px;color:var(--text);background:var(--white)}

/* ── PAGES ── */
.page{display:none}
.page.active{display:block}
</style>
</head>

</nav>

function nivelG2(s){s=Number(s)||0;return s<50?'nulo':s<75?'bajo':s<99?'medio':s<140?'alto':'muy_alto';}
function nivelG3(s){s=Number(s)||0;return s<50?'nulo':s<75?'bajo':s<99?'medio':s<140?'alto':'muy_alto';}
function nivelDom(rangos,s){s=Number(s)||0;if(s<=rangos[0])return 'nulo';if(s<=rangos[1])return 'bajo';if(s<=rangos[2])return 'medio';if(s<=rangos[3])return 'alto';return 'muy_alto';}
function nivelPct(n){return {nulo:5,bajo:25,medio:50,alto:75,muy_alto:100}[n]||0;}
function avg(arr,key){if(!arr.length)return 0;return arr.reduce((s,d)=>s+(Number(d[key])||0),0)/arr.length;}
function badge(n){return `<span class="badge badge-${n}">${NOM_LABELS[n]||n}</span>`;}
function edificioOf(d){
  const p=String(d.planta||'').toLowerCase().trim();
  if(p.includes('amér')||p.includes('amer')||p.includes('13000'))return 'Américas (13000)';
  if(p.includes('barr')||p.includes('13200'))return 'Barrancas (13200)';
  if(p.includes('cant')||p.includes('13500'))return 'Cantera (13500)';
  if(p.includes('juv')||p.includes('13700'))return 'Juventud (13700)';
  return d.planta||'Sin planta';
}
function fmtDate(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('es-MX');}catch{return String(d);}}

const PAGE_TITLES = {
  global:'Resultados Globales',edificios:'Por Edificio',dominios:'Por Dominio',
  departamentos:'Departamentos',cumplimiento:'Cumplimiento',pendientes:'Pendientes',
  guia2:'Registros Guía II',guia3:'Registros Guía III',ats:'Registros ATS'
};

function go(page){
  currentPage = page;
  document.getElementById('page-title').textContent = PAGE_TITLES[page]||page;
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll(`.sb-btn`).forEach(b=>{if(b.onclick&&b.onclick.toString().includes(`'${page}'`))b.classList.add('active');});
  render(page);
}

function render(page){
  const el = document.getElementById('content');
  el.innerHTML = '';
  if(page==='global')       renderGlobal(el);
  else if(page==='edificios')    renderEdificios(el);
  else if(page==='dominios')     renderDominios(el);
  else if(page==='departamentos')renderDepartamentos(el);
  else if(page==='cumplimiento') renderCumplimiento(el);
  else if(page==='pendientes')   renderPendientes(el);
  else if(page==='guia2')        renderTabla(el,'g2');
  else if(page==='guia3')        renderTabla(el,'g3');
  else if(page==='ats')          renderTabla(el,'ats');
}

// ══════════════════════════════════════════════════

// ══════════════════════════════════════════════════
async function sincronizar(){
  setStatus(false,'Sincronizando…');
  try{
    const r = await fetch(GAS_URL+'?action=getAll',{redirect:'follow'});
    const d = await r.json();
    if(!d.ok)throw new Error(d.error||'Error GAS');
    G2  = (d.grii  ||[]).map(r=>({...r, score:Number(r.score)||0, nivel:nivelG2(Number(r.score)||0)}));
    G3  = (d.griii ||[]).map(r=>({...r, score:Number(r.score)||0, nivel:nivelG3(Number(r.score)||0)}));
    ATS = d.ats   ||[];
    document.getElementById('cnt-g2').textContent  = G2.length;
    document.getElementById('cnt-g3').textContent  = G3.length;
    document.getElementById('cnt-ats').textContent = ATS.length;
    document.getElementById('sync-time').textContent = 'Sync: '+new Date().toLocaleTimeString('es-MX');
    setStatus(true,'Conectado');
    render(currentPage);
  }catch(e){
    setStatus(false,'Error: '+e.message);
    console.error(e);
  }
}

function setStatus(on, txt){
  document.getElementById('status-dot').className='dot'+(on?' on':'');
  document.getElementById('status-txt').textContent=txt;
}

  const colors = NOM_NIVELES.map(n=>NOM_COLORS_HEX[n]);
  const labels = NOM_NIVELES.map(n=>NOM_LABELS[n]);

  new Chart(document.getElementById('ch-dist-g2'),{
    type:'doughnut',
    data:{labels, datasets:[{data:NOM_NIVELES.map(nivCount), backgroundColor:colors, borderWidth:2, borderColor:'#fff'}]},
    options:{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}
  });
  new Chart(document.getElementById('ch-dist-g3'),{
    type:'doughnut',
    data:{labels, datasets:[{data:NOM_NIVELES.map(g3NivCount), backgroundColor:colors, borderWidth:2, borderColor:'#fff'}]},
    options:{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}
  });

  renderDomBars(document.getElementById('dom-bars-g2'), G2, DOMINIOS_G2);
}

function renderDomBars(el, data, dominios){
  if(!el)return;
  el.innerHTML = dominios.map(d=>{
    const prom  = avg(data, d.key);
    const nivel = nivelDom(d.rangos, prom);
    const pct   = nivelPct(nivel);
    const color = NOM_COLORS_HEX[nivel];
    return `<div class="dom-row">
      <div class="dom-label">${d.label}</div>
      <div class="dom-bar-bg"><div class="dom-bar" style="width:${pct}%;background:${color}"></div></div>
      <div class="dom-val">${prom.toFixed(0)}</div>
      <div class="dom-nivel">${badge(nivel)}</div>
    </div>`;
  }).join('');
}

function renderCumplimiento(el){
  const evaluados = new Set(G2.map(d=>String(d.noemp||'').trim()));
  const totalEval = evaluados.size;
  const pct = Math.round(totalEval/META_TOTAL*100);
  const color = pct>=90?'var(--green)':pct>=70?'var(--amber)':'var(--red)';

  const edificios = Object.keys(METAS);
  const rows = edificios.map(edif=>{
    const meta = METAS[edif];
    const evalSet = new Set(G2.filter(d=>edificioOf(d)===edif).map(d=>String(d.noemp||'').trim()));
    const evalN = evalSet.size;
    const pctE = Math.round(evalN/meta*100);
    const colorE = pctE>=90?'#15803D':pctE>=70?'#B45309':'#991B1B';
    return `<tr>
      <td style="font-weight:600">${edif.replace(/ \(\d+\)/,'')}</td>

      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="progress-wrap" style="flex:1"><div class="progress-bar" style="width:${Math.min(pctE,100)}%;background:${colorE}"></div></div>
          <span style="font-weight:700;color:${colorE};min-width:36px;font-size:12px">${pctE}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `
  <div class="grid-3" style="margin-bottom:16px">
    <div class="stat"><div class="stat-lbl">Meta Global</div><div class="stat-val">${META_TOTAL}</div><div class="stat-sub">Muestra NOM-035</div></div>
    <div class="stat"><div class="stat-lbl">Evaluados</div><div class="stat-val" style="color:${color}">${totalEval}</div><div class="stat-sub">Personas únicas G-II</div></div>
    <div class="stat"><div class="stat-lbl">Avance</div><div class="stat-val" style="color:${color}">${pct}%</div><div class="stat-sub">${META_TOTAL-totalEval} pendientes</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-weight:700;color:var(--navy)">Progreso Global</span>
      <span style="font-weight:800;font-size:18px;color:${color}">${pct}%</span>
    </div>
    <div class="progress-wrap" style="height:18px"><div class="progress-bar" style="width:${Math.min(pct,100)}%;background:${color}"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text3)"><span>0</span><span>${META_TOTAL}</span></div>
  </div>
  <div class="card">
    <div class="card-title">Avance por Planta</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Planta</th><th style="text-align:center">Meta</th><th style="text-align:center">Evaluados</th><th style="text-align:center">Pendientes</th><th>Avance</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>TOTAL</td>
          <td style="text-align:center">${META_TOTAL}</td>
          <td style="text-align:center;color:${color};font-weight:800">${totalEval}</td>
          <td style="text-align:center">${META_TOTAL-totalEval}</td>
          <td style="font-weight:800;color:${color}">${pct}%</td>
        </tr></tfoot>
      </table>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════
//  TABLAS DE REGISTROS
// ══════════════════════════════════════════════════
function renderTabla(el, tipo){
  const data = tipo==='g2'?G2:tipo==='g3'?G3:ATS;
  const cols = tipo==='g2'?
    ['noemp','nombre','planta','dept','score','nivel','catAmbiente','catFactores','catOrg','catLiderazgo','catEntorno','catInterferencia','catLidNeg']:
    tipo==='g3'?['noemp','nombre','planta','dept','score','nivel','catLiderazgo','catRelaciones','catParticipacion','catDistribucion','catCapacitacion']:
    ['noemp','nombre','planta','tipoEvento','fechaEvento','rol','sentimiento','atencion'];

  const hdrs = {noemp:'No.Emp',nombre:'Nombre',planta:'Planta',dept:'Depto',score:'Score',nivel:'Nivel',
    catAmbiente:'Ambiente',catFactores:'Factores',catOrg:'Org.Tiempo',catLiderazgo:'Liderazgo',
    catEntorno:'Entorno',catInterferencia:'Interferencia',catLidNeg:'Lid.Neg',
    catRelaciones:'Relaciones',catParticipacion:'Participación',catDistribucion:'Distribución',catCapacitacion:'Capacitación',
    tipoEvento:'Tipo Evento',fechaEvento:'Fecha',rol:'Rol',sentimiento:'Sentimiento',atencion:'Atención'};

  const rows = data.map((d,i)=>{
    const tds = cols.map(c=>{
      if(c==='nivel') return `<td>${badge(d.nivel||nivelG2(d.score))}</td>`;
      if(c==='score') return `<td>${Math.round(Number(d[c])||0)}</td>`;
      if(c==='nombre') return `<td style="font-weight:600;white-space:nowrap">${d[c]||'—'}</td>`;
      if(c==='planta') return `<td style="font-size:11px">${(d[c]||'').replace(/ \(\d+\)/,'')}</td>`;
      if(typeof d[c]==='number'||(!isNaN(Number(d[c]))&&d[c]!==''&&d[c]!==null)) return `<td>${Math.round(Number(d[c])||0)}</td>`;
      return `<td>${d[c]||'—'}</td>`;
    }).join('');
    return `<tr style="background:${i%2?'var(--bg)':'var(--white)'}" onclick="showDetail('${tipo}',${i})">${tds}</tr>`;
  }).join('');

  el.innerHTML = `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-size:13px;font-weight:700;color:var(--navy)">${data.length} registros</span>
      <button class="btn btn-outline btn-sm" onclick="exportarExcel('${tipo}')">📥 Excel</button>
    </div>
    <div class="tbl-wrap" style="max-height:600px;overflow-y:auto">
      <table>
        <thead style="position:sticky;top:0"><tr>${cols.map(c=>`<th>${hdrs[c]||c}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="font-size:11px;color:var(--text3);margin-top:8px">Clic en una fila para ver detalle</p>
  </div>`;
}

// ══════════════════════════════════════════════════
//  MODAL DETALLE PERSONA
// ══════════════════════════════════════════════════
function showDetail(tipo, idx){
  const d = tipo==='g2'?G2[idx]:tipo==='g3'?G3[idx]:ATS[idx];
  if(!d) return;
  const modal = document.getElementById('modal-body');

  if(tipo==='ats'){
    modal.innerHTML = `
      <div class="modal-name">⚠️ ${d.nombre||'—'}</div>
      <div class="modal-grid">
        <div class="modal-field"><label>No. Empleado</label><span>${d.noemp||'—'}</span></div>
        <div class="modal-field"><label>Planta</label><span>${d.planta||'—'}</span></div>
        <div class="modal-field"><label>Tipo Evento</label><span>${d.tipoEvento||'—'}</span></div>
        <div class="modal-field"><label>Fecha</label><span>${fmtDate(d.fechaEvento)}</span></div>
        <div class="modal-field"><label>Rol</label><span>${d.rol||'—'}</span></div>
        <div class="modal-field"><label>Atención</label><span>${d.atencion||'—'}</span></div>
      </div>
      <div class="modal-field" style="margin-bottom:8px"><label>Descripción</label><span>${d.descripcion||'—'}</span></div>
      <div class="modal-field"><label>Sentimiento</label><span>${d.sentimiento||'—'}</span></div>`;
  } else {
    const dominios = tipo==='g2'?DOMINIOS_G2:DOMINIOS_G3;
    const nivelFn  = tipo==='g2'?nivelG2:nivelG3;
    const domBars  = dominios.map(dom=>{
      const val   = Number(d[dom.key])||0;
      const nivel = nivelDom(dom.rangos, val);
      const pct   = nivelPct(nivel);
      const color = NOM_COLORS_HEX[nivel];
      return `<div class="dom-row">
        <div class="dom-label">${dom.label}</div>
        <div class="dom-bar-bg"><div class="dom-bar" style="width:${pct}%;background:${color}"></div></div>
        <div class="dom-val">${val}</div>
        <div class="dom-nivel">${badge(nivel)}</div>
      </div>`;
    }).join('');

    modal.innerHTML = `
      <div class="modal-name">${d.nombre||'—'}</div>
      <div class="modal-grid">
        <div class="modal-field"><label>No. Empleado</label><span>${d.noemp||'—'}</span></div>
        <div class="modal-field"><label>Puesto</label><span>${d.puesto||'—'}</span></div>
        <div class="modal-field"><label>Edificio</label><span>${d.planta||'—'}</span></div>
        <div class="modal-field"><label>Departamento</label><span>${d.dept||'—'}</span></div>
        <div class="modal-field"><label>Turno</label><span>${d.turno||'—'}</span></div>
        <div class="modal-field"><label>Categoría</label><span>${d.categoria||'—'}</span></div>
        <div class="modal-field"><label>Puntaje Total</label><span style="font-size:20px;font-weight:800;color:var(--navy)">${Math.round(Number(d.score)||0)} pts</span></div>
        <div class="modal-field"><label>Nivel de Riesgo</label><span>${badge(d.nivel||nivelFn(d.score))}</span></div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px">Desglose por Dominio</div>
      ${domBars}
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;color:var(--text3)">
        Barra indica nivel de riesgo (Nulo=5% · Bajo=25% · Medio=50% · Alto=75% · Muy Alto=100%) — Número es puntaje del dominio
      </div>`;
  }
  document.getElementById('modal-bg').classList.add('show');
}

function closeModal(e){
  if(e.target===document.getElementById('modal-bg'))
    document.getElementById('modal-bg').classList.remove('show');
}

// ══════════════════════════════════════════════════
//  EXPORTAR EXCEL
// ══════════════════════════════════════════════════
function exportarExcel(tipo){
  const wb = XLSX.utils.book_new();
  const addSheet = (data, name) => {
    if(!data.length) return;
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  if(!tipo||tipo==='g2')  addSheet(G2,'Guia_II');
  if(!tipo||tipo==='g3')  addSheet(G3,'Guia_III');
  if(!tipo||tipo==='ats') addSheet(ATS,'ATS');
  XLSX.writeFile(wb, 'NOM035_Resultados_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ══════════════════════════════════════════════════
//  PDF BÁSICO
// ══════════════════════════════════════════════════
async function generarPDF(){
  const overlay = document.getElementById('pdf-overlay');
  const msgEl   = document.getElementById('pdf-msg');
  if(overlay) overlay.classList.add('show');
  await new Promise(r=>setTimeout(r,100));
  try{
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
    const PW=215.9,PH=279.4,M=14,CW=PW-M*2;
    const NAVY=[13,43,90],WHITE=[255,255,255],GRAY=[240,244,250],TEXT=[15,23,42],TEXT2=[100,116,139];
    const NOM_C={nulo:[46,125,50],bajo:[249,168,37],medio:[239,108,0],alto:[198,40,40],muy_alto:[106,27,154]};
    const NOM_BG={nulo:[232,245,233],bajo:[255,248,225],medio:[255,243,224],alto:[255,235,238],muy_alto:[243,229,245]};
    const LABELS={nulo:'Nulo',bajo:'Bajo',medio:'Medio',alto:'Alto',muy_alto:'Muy Alto'};

    function hdr(p){doc.setFillColor(...NAVY);doc.rect(0,0,PW,16,'F');doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);doc.text('TELEFLEX — NOM-035-STPS-2018  |  Análisis de Resultados',M,10);doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(150,170,200);doc.text('Dr. Jaime Iván Martínez Espinoza  |  Cédula 12021447',M,14.5);doc.text('Pág.'+p,PW-M,10,{align:'right'});}
    function ftr(){doc.setFillColor(...NAVY);doc.rect(0,PH-10,PW,10,'F');doc.setFontSize(7);doc.setTextColor(150,170,200);const f=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});doc.text('Generado el '+f+' | Teleflex Chihuahua',PW/2,PH-4,{align:'center'});}
    function bar(x,y,w,h,pct,col,bg){doc.setFillColor(...(bg||GRAY));doc.rect(x,y,w,h,'F');if(pct>0){doc.setFillColor(...col);doc.rect(x,y,w*Math.min(pct,1),h,'F');}}
    function cell(x,y,w,h,nivel){const bg=NOM_BG[nivel]||[240,240,240];const c=NOM_C[nivel]||[100,100,100];doc.setFillColor(...bg);doc.rect(x,y,w,h,'F');doc.setDrawColor(...c);doc.setLineWidth(0.3);doc.rect(x,y,w,h,'S');doc.setFillColor(...c);doc.circle(x+3.5,y+h/2,1.2,'F');doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...c);doc.text(LABELS[nivel]||nivel,x+6,y+h/2+0.5,{baseline:'middle'});}

    let pg=1; hdr(pg); ftr();

    // PORTADA
    let y=22;
    doc.setFillColor(...NAVY);doc.rect(M,y,CW,35,'F');
    doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
    doc.text('Análisis de Resultados NOM-035',M+8,y+12);
    doc.setFontSize(11);doc.setFont('helvetica','normal');
    doc.text('Identificación y Prevención de Factores de Riesgo Psicosocial',M+8,y+20);
    doc.setFontSize(9);doc.setTextColor(180,200,220);
    doc.text('Teleflex Chihuahua  |  '+new Date().toLocaleDateString('es-MX',{month:'long',year:'numeric'}),M+8,y+29);
    y+=42;

    // Stats boxes
    const total=G2.length,muAlto=G2.filter(d=>d.nivel==='muy_alto').length,alto=G2.filter(d=>d.nivel==='alto').length;
    const medio=G2.filter(d=>d.nivel==='medio').length,bajNul=G2.filter(d=>d.nivel==='nulo'||d.nivel==='bajo').length;
    const avgS=total?Math.round(avg(G2,'score')):0;
    const boxes=[
      {l:'Total Evaluados',v:String(total),s:'Guía II',c:NAVY},
      {l:'Muy Alto',v:String(muAlto),s:'Intervención urgente',c:NOM_C.muy_alto},
      {l:'Alto',v:String(alto),s:'Plan de acción',c:NOM_C.alto},
      {l:'Medio',v:String(medio),s:'Seguimiento',c:NOM_C.medio},
      {l:'Bajo/Nulo',v:String(bajNul),s:'Sin intervención',c:NOM_C.bajo},
      {l:'Score Promedio',v:String(avgS)+' pts',s:'Guía II global',c:NAVY},
    ];
    const bw=(CW-10)/3,bh=22;
    boxes.forEach((b,i)=>{
      const bx=M+(i%3)*(bw+5);const by=y+Math.floor(i/3)*(bh+5);
      doc.setFillColor(...GRAY);doc.rect(bx,by,bw,bh,'F');
      doc.setFillColor(...b.c);doc.rect(bx,by,3,bh,'F');
      doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(...TEXT2);doc.text(b.l,bx+6,by+5.5);
      doc.setFontSize(13);doc.setFont('helvetica','bold');doc.setTextColor(...b.c);doc.text(b.v,bx+6,by+13.5);
      doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT2);doc.text(b.s,bx+6,by+19);
    });
    y+=bh*2+15;

    // Por Edificio
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...NAVY);
    doc.text('Resultados por Edificio',M,y);y+=6;
    const edifs=Object.keys(METAS);
    const thW=[40,20,22,22,22,22];
    const ths=['Edificio','Evaluados','Prom G-II','Nivel G-II','Prom G-III','Nivel G-III'];
    let x=M;
    doc.setFillColor(...NAVY);doc.rect(M,y,CW,7,'F');
    doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
    ths.forEach((h,i)=>{doc.text(h,x+2,y+4.5);x+=thW[i];});
    y+=7;
    edifs.forEach((edif,ei)=>{
      const g2e=G2.filter(d=>edificioOf(d)===edif);
      const g3e=G3.filter(d=>edificioOf(d)===edif);
      const avgG2e=avg(g2e,'score'),avgG3e=avg(g3e,'score');
      const nivG2e=nivelG2(avgG2e),nivG3e=nivelG3(avgG3e);
      doc.setFillColor(...(ei%2?GRAY:[255,255,255]));doc.rect(M,y,CW,7,'F');
      doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT);
      let rx=M;
      [edif.replace(/ \(\d+\)/,''),g2e.length,avgG2e.toFixed(0),'',avgG3e.toFixed(0),''].forEach((v,i)=>{
        if(i===3) cell(rx,y+0.5,thW[i]-2,6,nivG2e);
        else if(i===5) cell(rx,y+0.5,thW[i]-2,6,nivG3e);
        else doc.text(String(v),rx+2,y+4.5);
        rx+=thW[i];
      });
      y+=7;
    });
    y+=8;

    // Dominios
    if(y>220){doc.addPage();pg++;hdr(pg);ftr();y=22;}
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...NAVY);
    doc.text('Desglose por Dominio — Guía II (Global)',M,y);y+=6;
    DOMINIOS_G2.forEach(d=>{
      const prom=avg(G2,d.key);
      const nivel=nivelDom(d.rangos,prom);
      const pct=nivelPct(nivel)/100;
      const c=NOM_C[nivel]||[100,100,100];
      doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT);
      doc.text(d.label,M,y+3.5);
      bar(M+48,y,CW-80,5,pct,c,GRAY);
      doc.setFontSize(7);doc.setTextColor(...TEXT2);doc.text(prom.toFixed(0),M+CW-28,y+3.5);
      cell(M+CW-22,y,20,5.5,nivel);
      y+=8;
    });

    // ATS summary
    if(ATS.length>0){
      if(y>220){doc.addPage();pg++;hdr(pg);ftr();y=22;}
      y+=4;
      doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...NAVY);
      doc.text('Acontecimiento Traumático Severo (ATS) — '+ATS.length+' reportes',M,y);y+=7;
      doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT);
      ATS.slice(0,15).forEach(a=>{
        doc.text((a.nombre||'—').substring(0,30),M,y+3.5);
        doc.text(a.tipoEvento||'—',M+65,y+3.5);
        doc.text(a.rol||'—',M+105,y+3.5);
        doc.text(fmtDate(a.fechaEvento),M+130,y+3.5);
        y+=6;if(y>255){doc.addPage();pg++;hdr(pg);ftr();y=22;}
      });
    }

    if(msgEl) msgEl.textContent='Guardando…';
    doc.save('NOM035_Analisis_'+new Date().toISOString().slice(0,10)+'.pdf');
  }catch(e){
    console.error('PDF error:',e);
    alert('Error generando PDF: '+e.message);
  }finally{
    if(overlay) overlay.classList.remove('show');
  }
}

go('global');
sincronizar();
</script>
